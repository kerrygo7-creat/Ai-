<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI 名單中心 Demo</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--line:#e6eaf0;--text:#172033;--muted:#6b7280;
  --primary:#2563eb;--nav:#111827;--green:#16a34a;--orange:#ea580c;--red:#dc2626;
  --purple:#7c3aed;--shadow:0 8px 24px rgba(15,23,42,.06)
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,#111827,#16243a);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;margin-bottom:28px}
.logo{width:34px;height:34px;border-radius:10px;background:#2563eb;display:grid;place-items:center}
.nav-title{font-size:12px;color:#94a3b8;margin:14px 8px 8px}
.nav-item{padding:11px 12px;border-radius:10px;margin:4px 0;color:#dbeafe}
.nav-item.active{background:#1d4ed8;color:#fff}
.main{padding:26px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.topbar h1{margin:0 0 4px;font-size:28px}
.topbar p{margin:0;color:var(--muted)}
.actions{display:flex;gap:10px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff}
.btn-light{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn-success{background:#dcfce7;color:#166534}
.btn-danger{background:#fee2e2;color:#991b1b}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.kpi .label{font-size:13px;color:var(--muted)}
.kpi .num{font-size:28px;font-weight:800;margin-top:4px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid var(--line)}
.panel-head h3{margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1150px}
th,td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;font-size:13px}
th{background:#f8fafc;color:#475569;font-size:12px;position:sticky;top:0}
.company{font-weight:800;font-size:14px;margin-bottom:4px}
.meta{color:var(--muted);font-size:12px;line-height:1.5}
.tag{display:inline-block;font-size:11px;padding:4px 7px;border-radius:999px;margin:2px 3px 2px 0}
.erp{background:#dbeafe;color:#1d4ed8}.ai{background:#f3e8ff;color:#7e22ce}.api{background:#ffedd5;color:#c2410c}.bi{background:#ccfbf1;color:#0f766e}
.score{font-weight:800;font-size:17px}
.score.high{color:#15803d}.score.mid{color:#c2410c}.score.low{color:#b91c1c}
.reason{max-width:320px;line-height:1.55}
.source{max-width:230px;line-height:1.55}
.status{display:inline-block;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}
.pending{background:#fff7ed;color:#c2410c}.accepted{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.note{background:#eef2ff;color:#3730a3;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45}
.empty{padding:30px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:24px;bottom:24px;background:#111827;color:white;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.app{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">AI</div>開發戰情室</div>
    <div class="nav-title">主選單</div>
    <div class="nav-item">🏠 首頁儀表板</div>
    <div class="nav-item active">✨ AI 名單中心</div>
    <div class="nav-item">📞 待聯繫名單</div>
    <div class="nav-item">🔥 有效商機</div>
    <div class="nav-item">📅 待追蹤</div>
    <div class="nav-item">✅ 已結案</div>
    <div class="nav-title">管理</div>
    <div class="nav-item">👥 業務指派</div>
    <div class="nav-item">▥ 統計報表</div>
    <div class="nav-item">⚙ AI 規則設定</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>AI 名單中心</h1>
        <p>自動彙整公開訊號，先由 AI 評估，再決定是否進入待聯繫。</p>
      </div>
      <div class="actions">
        <button class="btn btn-light" onclick="resetDemo()">重置 Demo</button>
        <button class="btn btn-primary" onclick="simulateAI()">＋ 模擬 AI 匯入</button>
      </div>
    </div>

    <section class="kpis" id="kpis"></section>

    <section class="panel">
      <div class="panel-head">
        <h3>AI 待審核名單</h3>
        <div class="filters">
          <input id="search" placeholder="搜尋公司名稱" oninput="render()">
          <select id="typeFilter" onchange="render()">
            <option value="">全部類型</option>
            <option value="ERP">ERP</option>
            <option value="AI">AI</option>
            <option value="戰情室">戰情室</option>
            <option value="API串接">API串接</option>
            <option value="MES串接">MES串接</option>
          </select>
          <select id="scoreFilter" onchange="render()">
            <option value="">全部分數</option>
            <option value="80">80 分以上</option>
            <option value="70">70 分以上</option>
            <option value="50">50 分以上</option>
          </select>
          <select id="statusFilter" onchange="render()">
            <option value="">全部狀態</option>
            <option value="pending">待審核</option>
            <option value="accepted">已加入待聯繫</option>
            <option value="rejected">已排除</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>公司</th>
              <th>商機類型</th>
              <th>AI 分數</th>
              <th>AI 判斷理由</th>
              <th>原始來源</th>
              <th>建議</th>
              <th>狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const seed = [
  {
    id:1, company:'XX精密股份有限公司', city:'台中市', industry:'精密機械',
    types:['ERP','MES串接'], score:91,
    reason:'近期同時招募 ERP 專案管理師與 MES 工程師，且公開資訊顯示有新產線擴建。',
    source:'104 徵才 + 公司官網新聞',
    suggestion:'優先聯繫資訊主管，主打 ERP 汰換與 MES 串接。',
    status:'pending'
  },
  {
    id:2, company:'OO生技股份有限公司', city:'新竹縣', industry:'生技製造',
    types:['ERP','戰情室'], score:86,
    reason:'近期新增倉儲與資訊職缺，並強調批號、效期與數據追蹤需求。',
    source:'公司徵才頁 + 官網',
    suggestion:'可切入批號效期、先進先出與管理戰情室。',
    status:'pending'
  },
  {
    id:3, company:'AA貿易有限公司', city:'台北市', industry:'進出口貿易',
    types:['API串接','AI'], score:74,
    reason:'正在招募電商營運與系統整合人員，官網已使用多通路購物平台。',
    source:'LinkedIn 公開職缺 + 官網',
    suggestion:'先詢問 Shopline / momo / 蝦皮串接需求。',
    status:'pending'
  },
  {
    id:4, company:'BB工業股份有限公司', city:'彰化縣', industry:'金屬加工',
    types:['ERP'], score:58,
    reason:'有 ERP 工程師職缺，但職缺內容主要為既有系統維護。',
    source:'104 徵才',
    suggestion:'優先度低，建議先人工確認是否有汰換計畫。',
    status:'pending'
  },
  {
    id:5, company:'CC電子股份有限公司', city:'桃園市', industry:'電子製造',
    types:['ERP','AI','戰情室'], score:94,
    reason:'近期公開提及智慧製造、數位轉型與新廠建置，並新增 BI 與資料工程相關職缺。',
    source:'新聞稿 + 公司官網 + 徵才資訊',
    suggestion:'高優先，建議以 ERP＋AI＋戰情室整合提案切入。',
    status:'accepted'
  },
  {
    id:6, company:'DD有限公司', city:'台南市', industry:'一般買賣',
    types:['ERP'], score:42,
    reason:'僅出現一般 MIS 維護職缺，沒有明確導入或擴建訊號。',
    source:'1111 人力銀行',
    suggestion:'不建議投入開發資源。',
    status:'rejected'
  }
];
let leads = JSON.parse(localStorage.getItem('ai_lead_center')||'null') || seed;

function save(){localStorage.setItem('ai_lead_center',JSON.stringify(leads))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tagClass(t){if(t.includes('ERP'))return 'erp';if(t.includes('AI'))return 'ai';if(t.includes('API')||t.includes('MES'))return 'api';return 'bi'}
function scoreClass(s){return s>=80?'high':s>=60?'mid':'low'}
function statusText(s){return s==='pending'?'待審核':s==='accepted'?'已加入待聯繫':'已排除'}
function statusClass(s){return s}

function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const type=document.getElementById('typeFilter').value;
  const minScore=Number(document.getElementById('scoreFilter').value||0);
  const st=document.getElementById('statusFilter').value;

  let rows=leads.filter(x=>
    (!q || x.company.toLowerCase().includes(q)) &&
    (!type || x.types.includes(type)) &&
    x.score>=minScore &&
    (!st || x.status===st)
  ).sort((a,b)=>b.score-a.score);

  document.getElementById('tbody').innerHTML = rows.length ? rows.map(x=>`
    <tr>
      <td>
        <div class="company">${esc(x.company)}</div>
        <div class="meta">${esc(x.city)}｜${esc(x.industry)}</div>
      </td>
      <td>${x.types.map(t=>`<span class="tag ${tagClass(t)}">${esc(t)}</span>`).join('')}</td>
      <td><span class="score ${scoreClass(x.score)}">${x.score}</span></td>
      <td><div class="reason">${esc(x.reason)}</div></td>
      <td><div class="source">${esc(x.source)}</div></td>
      <td><div class="note">${esc(x.suggestion)}</div></td>
      <td><span class="status ${statusClass(x.status)}">${statusText(x.status)}</span></td>
      <td>
        <div class="row-actions">
          <button class="btn btn-success" onclick="acceptLead(${x.id})">加入待聯繫</button>
          <button class="btn btn-danger" onclick="rejectLead(${x.id})">排除</button>
        </div>
      </td>
    </tr>`).join('') : `<tr><td colspan="8"><div class="empty">目前沒有符合條件的名單</div></td></tr>`;

  const total=leads.length;
  const pending=leads.filter(x=>x.status==='pending').length;
  const accepted=leads.filter(x=>x.status==='accepted').length;
  const high=leads.filter(x=>x.score>=80).length;
  const rejected=leads.filter(x=>x.status==='rejected').length;
  const data=[['AI 匯入總數',total],['待審核',pending],['80 分以上',high],['待聯繫',accepted],['已排除',rejected]];
  document.getElementById('kpis').innerHTML=data.map(([a,b])=>`<div class="kpi"><div class="label">${a}</div><div class="num">${b}</div></div>`).join('');
}

function acceptLead(id){
  const x=leads.find(i=>i.id===id); if(!x)return;
  x.status='accepted'; save(); render(); toast('已加入待聯繫名單');
}
function rejectLead(id){
  const x=leads.find(i=>i.id===id); if(!x)return;
  x.status='rejected'; save(); render(); toast('已排除名單');
}
function simulateAI(){
  const pool=[
    {
      company:'新曜機械股份有限公司',city:'台中市',industry:'機械製造',
      types:['ERP','MES串接'],score:89,
      reason:'近期新設廠區並招募資訊整合與生產系統人員。',
      source:'公開新聞 + 徵才資訊',
      suggestion:'建議切入 ERP、生管與 MES 串接需求。'
    },
    {
      company:'安禾生醫股份有限公司',city:'新北市',industry:'生醫保健',
      types:['ERP','戰情室'],score:84,
      reason:'職缺內容涉及批號、效期、倉儲與管理報表。',
      source:'公司官網 + 公開職缺',
      suggestion:'主打批號效期、先進先出與管理報表。'
    },
    {
      company:'鉅星貿易有限公司',city:'台北市',industry:'電商貿易',
      types:['API串接','AI'],score:79,
      reason:'近期拓展多平台電商並招募系統整合相關職缺。',
      source:'官網 + 公開徵才',
      suggestion:'先確認電商平台與 API 串接現況。'
    }
  ];
  const item=pool[Math.floor(Math.random()*pool.length)];
  leads.unshift({id:Date.now(),...item,status:'pending'});
  save(); render(); toast('AI 已模擬匯入 1 筆新名單');
}
function resetDemo(){
  leads=JSON.parse(JSON.stringify(seed)); save(); render(); toast('Demo 已重置');
}
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1600)
}
render();
</script>
</body>
</html>
